// ---------- Daten & Hilfsfunktionen ----------
const DATA_URL="data.json",DATA_KEY="lc_data13",SAVED_KEY="lc_sv13",LANG_KEY="lc_lang",SKIP_KEY="lc_install_skip";
const FALLBACK_IMG={logo:"https://app.trickle.so/storage/public/images/usr_1a6da71af0000001/e5c2fd38-03c9-40e8-a275-becc52e0e3c8.png",hero:"https://app.trickle.so/storage/public/images/usr_1a6da71af0000001/70bdd53e-03b3-459e-8237-801da1b3aff3.avif",roomPlan:""};
const validData=d=>!!(d&&d.schedule&&Array.isArray(d.schedule.de)&&Array.isArray(d.schedule.en)&&Array.isArray(d.speakers)&&Array.isArray(d.sponsors)&&d.event);
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const loadCachedData=()=>{try{const d=JSON.parse(store.get(DATA_KEY));return validData(d)?d:null;}catch(e){return null;}};
const img=(d,k)=>(d&&d.images&&d.images[k])||FALLBACK_IMG[k];

const isMinor=t=>t==="break"||t==="reception";
const fmtTs=(iso,ln)=>{try{return new Date(iso).toLocaleString(ln==="de"?"de-DE":"en-GB",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch(e){return"";}};
const matchSpeakers=(e,spk)=>e.speaker?spk.filter(s=>e.speaker.includes(s.n)):[];
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const platform=()=>{const ua=navigator.userAgent||"";return(/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))?"ios":"android";};

// Zeiten: "11:15 – 12:15" bzw. "11:15" (Ende = Start + 45 min)
function parseTime(s){const m=(s||"").match(/(\d{1,2}):(\d{2})(?:\s*[–-]\s*(\d{1,2}):(\d{2}))?/);if(!m)return null;const a=+m[1]*60+ +m[2];const b=m[3]?+m[3]*60+ +m[4]:a+45;return{start:a,end:b,hasEnd:!!m[3]};}
// Europe/Berlin-Uhrzeit -> Date (UTC)
function berlinDate(iso,minutes){const[y,mo,d]=iso.split("-").map(Number);const guess=Date.UTC(y,mo-1,d,Math.floor(minutes/60),minutes%60);
 const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Europe/Berlin",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date(guess));
 const g=k=>+parts.find(p=>p.type===k).value;const asBerlin=Date.UTC(g("year"),g("month")-1,g("day"),g("hour"),g("minute"));return new Date(guess-(asBerlin-guess));}
// Programmpunkte mit absoluten Zeiten anreichern
function timeline(d,ln){const days=d.schedule[ln]||d.schedule.de;const iso=d.event.days||[];
 return days.flatMap((dy,di)=>dy.events.map(e=>{const t=parseTime(e.time);const day=iso[di];return{...e,di,dayLabel:dy.day,t,startAt:t&&day?berlinDate(day,t.start):null,endAt:t&&day?berlinDate(day,t.end):null};}));}

function useNow(ms=30000){const[n,setN]=useState(()=>new Date());useEffect(()=>{const i=setInterval(()=>setN(new Date()),ms);return()=>clearInterval(i);},[ms]);return n;}

function useCongressData(){const[data,setData]=useState(loadCachedData);const[status,setStatus]=useState("loading");
const sync=useCallback(async()=>{try{const r=await fetch(DATA_URL,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();if(!validData(d))throw new Error("invalid");
setData(p=>p&&p.updatedAt===d.updatedAt?p:d);store.set(DATA_KEY,JSON.stringify(d));setStatus(navigator.onLine===false?"offline":"ok");}catch(e){setStatus("offline");}},[]);
useEffect(()=>{sync();const iv=setInterval(sync,10*60*1000);const vis=()=>{if(document.visibilityState==="visible")sync();};document.addEventListener("visibilitychange",vis);window.addEventListener("online",sync);
return()=>{clearInterval(iv);document.removeEventListener("visibilitychange",vis);window.removeEventListener("online",sync);};},[sync]);
return{data,status,sync};}

// Kalender-Export (.ics)
function icsFor(events,d){const pad=n=>String(n).padStart(2,"0");const f=dt=>`${dt.getUTCFullYear()}${pad(dt.getUTCMonth()+1)}${pad(dt.getUTCDate())}T${pad(dt.getUTCHours())}${pad(dt.getUTCMinutes())}00Z`;
 const esc=s=>(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");const loc=(d.event.location&&d.event.location.de)||"";
 const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//EBS Law Congress//App//DE","CALSCALE:GREGORIAN"];
 events.filter(e=>e.startAt).forEach(e=>{lines.push("BEGIN:VEVENT",`UID:${e.id}@ebs-lawcongress.com`,`DTSTAMP:${f(new Date())}`,`DTSTART:${f(e.startAt)}`,`DTEND:${f(e.endAt)}`,`SUMMARY:${esc(e.title)}`,`LOCATION:${esc([e.location,loc].filter(Boolean).join(", "))}`,`DESCRIPTION:${esc([e.speaker,e.description].filter(Boolean).join("\n\n"))}`,"END:VEVENT");});
 lines.push("END:VCALENDAR");return lines.join("\r\n");}
function downloadIcs(events,d,name){const blob=new Blob([icsFor(events,d)],{type:"text/calendar;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}

function Chips({items,value,onChange}){return(<div className="flex gap-2 overflow-x-auto no-scrollbar">{items.map(([id,lb])=><button key={id} onClick={()=>onChange(id)} className={`px-3.5 py-1.5 rounded-full text-xs font-semibold border whitespace-nowrap transition-colors ${value===id?"bg-accent border-accent text-white":"bg-white border-ink3/15 text-ink3"}`}>{lb}</button>)}</div>);}
function Sheet({onClose,children,label}){useEffect(()=>{const k=e=>{if(e.key==="Escape")onClose();};document.addEventListener("keydown",k);const o=document.body.style.overflow;document.body.style.overflow="hidden";return()=>{document.removeEventListener("keydown",k);document.body.style.overflow=o;};},[onClose]);
return(<div className="fixed inset-0 z-[60] bg-black/50 flex items-end sm:items-center justify-center" onClick={onClose} role="dialog" aria-modal="true" aria-label={label}>
<div className="animate-slideUp bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto shadow-2xl safe-bottom" onClick={e=>e.stopPropagation()}>
<div className="sticky top-0 z-10 flex justify-center pt-2 pb-1 bg-transparent pointer-events-none"><span className="w-10 h-1 rounded-full bg-ink3/25"/></div>{children}</div></div>);}

function NowCard({d,ln,t,now,onOpen}){const tl=useMemo(()=>timeline(d,ln).filter(e=>e.startAt&&!isMinor(e.type)),[d,ln]);const ev=d.event;
 const days=(ev.days||[]).map(x=>berlinDate(x,0));if(!days.length)return null;
 const first=days[0],lastEnd=new Date(days[days.length-1].getTime()+24*3600e3);
 if(now<first){const diff=Math.ceil((first-now)/(24*3600e3));return(<div className="mt-3 flex items-center gap-2 text-sm text-white/90"><I.Cal size={15}/>{diff<=1?t.schedule.tomorrow:t.schedule.until(diff)}</div>);}
 if(now>=lastEnd)return(<p className="mt-3 text-sm text-white/80">{t.schedule.over}</p>);
 const live=tl.filter(e=>e.startAt<=now&&now<e.endAt);const next=tl.filter(e=>e.startAt>now).sort((a,b)=>a.startAt-b.startAt);const nxt=next.length?next.filter(e=>+e.startAt===+next[0].startAt):[];
 const Item=({e})=>(<button onClick={()=>onOpen(e)} className="w-full text-left bg-white/10 rounded-lg px-3 py-2 mt-1.5 active:bg-white/20"><p className="text-sm font-semibold leading-snug line-clamp-3">{e.title}</p><p className="text-[11px] text-white/70 mt-0.5">{e.time}{e.location?` · ${e.location}`:""}</p></button>);
 return(<div className="mt-4 space-y-3">
 {live.length>0&&<div><p className="flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-sky-300"><span className="w-1.5 h-1.5 rounded-full bg-sky-300 live-dot"/>{t.schedule.now}</p>{live.slice(0,3).map(e=><Item key={e.id} e={e}/>)}</div>}
 {nxt.length>0&&<div><p className="text-[11px] font-bold uppercase tracking-wider text-white/70">{t.schedule.next}</p>{nxt.slice(0,2).map(e=><Item key={e.id} e={e}/>)}</div>}</div>);}

 <div className="relative pt-[120%]"><img src={s.img} alt={s.n} loading="lazy" className="absolute inset-0 w-full h-full object-cover object-[center_20%]"/>
 <div className="absolute inset-0 bg-gradient-to-t from-primary via-primary/30 to-transparent"/>
 <div className="absolute bottom-0 inset-x-0 p-3 text-white"><p className="font-serif text-[15px] font-bold leading-tight">{s.n}</p><p className="text-sky-300 text-[11px] font-medium leading-snug mt-0.5 line-clamp-3">{role(s)}</p>{org(s)&&<p className="text-white/70 text-[10px] leading-snug mt-0.5 truncate">{org(s)}</p>}</div></div></button>)}</div>}
 </div>);}

// ---------- Partner ----------
function PartnersView({d,t}){return(<div>
 <Title sub={`${d.sponsors.length} ${t.nav.partners}`}>{t.partners.title}</Title>
 <div className="grid grid-cols-3 gap-2.5">{d.sponsors.map((s,i)=><a key={i} href={s.u||undefined} target="_blank" rel="noopener noreferrer" className="bg-white rounded-xl border border-ink3/10 shadow-sm aspect-square flex flex-col items-center justify-center p-2.5 animate-fadeUp active:scale-95 transition-transform">
 <div className="flex-1 w-full flex items-center justify-center"><img src={s.l} alt={s.n} loading="lazy" className="max-h-12 max-w-full object-contain"/></div>
 <span className="text-[10px] font-medium text-ink3 text-center leading-tight line-clamp-3">{s.n}</span></a>)}</div>
 </div>);}

// ---------- App ----------
function App(){
 const[ln,setLnRaw]=useState(()=>store.get(LANG_KEY)||((navigator.language||"de").toLowerCase().startsWith("de")?"de":"en"));
 const setLn=l=>{setLnRaw(l);store.set(LANG_KEY,l);document.documentElement.lang=l;};
 const t=TT[ln];const now=useNow();
 const[showInstall,setShowInstall]=useState(()=>{try{return!isStandalone()&&!sessionStorage.getItem(SKIP_KEY);}catch(e){return!isStandalone();}});
 const cont=useCallback(()=>{try{sessionStorage.setItem(SKIP_KEY,"1");}catch(e){}setShowInstall(false);window.scrollTo(0,0);},[]);
 const[vw,setVw]=useState("schedule");
 const[saved,setSaved]=useState(()=>{try{return new Set(JSON.parse(store.get(SAVED_KEY)||"[]"));}catch(e){return new Set();}});
 const toggle=useCallback(id=>{setSaved(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);store.set(SAVED_KEY,JSON.stringify([...n]));if(navigator.vibrate)navigator.vibrate(8);return n;});},[]);
 const{data:d,status,sync}=useCongressData();
 const[selEvent,setSelEvent]=useState(null);const[selSpeaker,setSelSpeaker]=useState(null);
 const openEvent=useCallback(e=>{setSelSpeaker(null);setSelEvent(e);},[]);const openSpeaker=useCallback(p=>{setSelEvent(null);setSelSpeaker(p);},[]);
 useEffect(()=>{const b=document.getElementById("boot");if(b)b.remove();document.documentElement.lang=ln;},[]);
 const savedCount=useMemo(()=>d?d.schedule.de.reduce((n,dy)=>n+dy.events.filter(e=>saved.has(e.id)).length,0):0,[d,saved]);
 const go=v=>{setVw(v);window.scrollTo(0,0);};

 if(showInstall)return <InstallPage data={d} ln={ln} setLn={setLn} t={t} onContinue={cont}/>;

 const nav=[["schedule",t.nav.schedule,I.Cal],["my",t.nav.my,I.Bm],["room",t.nav.room,I.Map],["speakers",t.nav.speakers,I.Users],["partners",t.nav.partners,I.Award]];
 return(<div className="min-h-screen bg-cream">
 <header className="sticky top-0 z-50 bg-primary text-white shadow-md safe-top">
 <div className="flex justify-between items-center h-14 px-4">
 <button onClick={()=>go("schedule")} className="flex items-center gap-2.5 min-w-0"><img src={img(d,"logo")} alt="" className="h-9 w-9 object-contain flex-shrink-0"/><span className="font-serif text-[17px] leading-tight font-bold text-cream truncate">{(d&&d.event.name)||"EBS Law Congress"}</span></button>
 <div className="flex items-center gap-2 flex-shrink-0">
 {status==="offline"&&d&&<span title={t.gen.offline} className="text-white/60"><I.Wifi size={16}/></span>}
 <button onClick={()=>setLn(ln==="de"?"en":"de")} className="text-xs font-bold border border-white/70 px-2.5 py-1 rounded-sm">{ln==="de"?"EN":"DE"}</button></div></div></header>

 <main className="px-4 pt-4 pb-28 max-w-2xl mx-auto">
 {!d?<div className="text-center py-24">{status==="loading"?<p className="text-ink3 text-sm">{t.gen.loading}</p>:<><p className="text-ink2 text-sm mb-5">{t.gen.loadErr}</p><button onClick={sync} className="bg-accent text-white px-6 py-3 rounded-lg font-semibold">{t.gen.retry}</button></>}</div>:<>
 {vw==="schedule"&&<ScheduleView d={d} ln={ln} t={t} saved={saved} onToggle={toggle} status={status} openEvent={openEvent} now={now}/>}
 {vw==="my"&&<MyPlanView d={d} ln={ln} t={t} saved={saved} onToggle={toggle} openEvent={openEvent} go={go} now={now}/>}
 {vw==="room"&&<RoomView d={d} ln={ln} t={t}/>}
 {vw==="speakers"&&<SpeakersView d={d} ln={ln} t={t} openSpeaker={openSpeaker}/>}
 {vw==="partners"&&<PartnersView d={d} t={t}/>}
 {selEvent&&<EventDetail e={selEvent} saved={saved.has(selEvent.id)} onToggle={toggle} onClose={()=>setSelEvent(null)} t={t} ln={ln} d={d} openSpeaker={openSpeaker}/>}
 {selSpeaker&&<SpeakerSheet p={selSpeaker} d={d} ln={ln} t={t} onClose={()=>setSelSpeaker(null)} openEvent={openEvent}/>}</>}
 </main>

 <nav className="fixed bottom-0 inset-x-0 z-50 bg-white/95 backdrop-blur border-t border-ink3/10 safe-bottom">
 <div className="flex max-w-2xl mx-auto">{nav.map(([id,lb,Ic])=>{const a=vw===id;return(<button key={id} onClick={()=>go(id)} aria-current={a?"page":undefined} className={`relative flex-1 flex flex-col items-center pt-2 pb-1.5 transition-colors ${a?"text-primary":"text-ink3/55"}`}>
 <span className={`relative flex items-center justify-center w-14 h-7 rounded-full transition-colors ${a?"bg-primary/10":""}`}><Ic size={20} strokeWidth={a?2.3:1.8}/>{id==="my"&&savedCount>0&&<span className="absolute -top-0.5 right-2 min-w-[16px] h-4 px-1 rounded-full bg-accent text-white text-[10px] font-bold flex items-center justify-center">{savedCount}</span>}</span>
 <span className={`text-[10px] mt-0.5 ${a?"font-bold":"font-medium"}`}>{lb}</span></button>);})}</div></nav>
 </div>);}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
