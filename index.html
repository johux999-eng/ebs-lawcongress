// ---------- Daten ----------
const DATA_URL="data.json",DATA_KEY="lc_data13",SAVED_KEY="lc_sv13",LANG_KEY="lc_lang",SKIP_KEY="lc_install_skip";
const FALLBACK_IMG={logo:"https://app.trickle.so/storage/public/images/usr_1a6da71af0000001/e5c2fd38-03c9-40e8-a275-becc52e0e3c8.png",hero:"https://app.trickle.so/storage/public/images/usr_1a6da71af0000001/70bdd53e-03b3-459e-8237-801da1b3aff3.avif",roomPlan:""};
const validData=d=>!!(d&&d.schedule&&Array.isArray(d.schedule.de)&&Array.isArray(d.schedule.en)&&Array.isArray(d.speakers)&&Array.isArray(d.sponsors)&&d.event);
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
function loadCachedData(){try{const d=JSON.parse(store.get(DATA_KEY));return validData(d)?d:null;}catch(e){return null;}}
const img=(d,k)=>(d&&d.images&&d.images[k])||FALLBACK_IMG[k];
const isTalk=t=>t==="lecture"||t==="keynote"||t==="panel";
function fmtTs(iso,ln){try{return new Date(iso).toLocaleString(ln==="de"?"de-DE":"en-GB",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return"";}}
const matchSpeakers=(e,spk)=>e.speaker?spk.filter(s=>e.speaker.includes(s.n)):[];
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const platform=()=>{const ua=navigator.userAgent||"";if(/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))return"ios";return"android";};

function useCongressData(){const[data,setData]=useState(loadCachedData);const[status,setStatus]=useState("loading");
const sync=useCallback(async()=>{try{const r=await fetch(DATA_URL,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();if(!validData(d))throw new Error("invalid");
setData(p=>p&&p.updatedAt===d.updatedAt?p:d);store.set(DATA_KEY,JSON.stringify(d));setStatus(navigator.onLine===false?"offline":"ok");}catch(e){setStatus("offline");}},[]);
useEffect(()=>{sync();const iv=setInterval(sync,10*60*1000);const vis=()=>{if(document.visibilityState==="visible")sync();};document.addEventListener("visibilitychange",vis);window.addEventListener("online",sync);
return()=>{clearInterval(iv);document.removeEventListener("visibilitychange",vis);window.removeEventListener("online",sync);};},[sync]);
return{data,status,sync};}

// ---------- Bausteine im Stil der Website ----------
function SectionHead({label,title,desc,dark}){return(<div className="text-center mb-8">
{label&&<p className="text-accent font-bold tracking-wider text-sm uppercase mb-2">{label}</p>}
<h2 className={`font-serif text-3xl font-bold mb-4 ${dark?"text-white":"text-primary"}`}>{title}</h2>
<div className="w-24 h-1 bg-accent mx-auto"/>
{desc&&<p className="text-ink2 text-sm mt-5 max-w-md mx-auto leading-relaxed">{desc}</p>}</div>);}

function Pills({ev,ln}){return(<div className="flex flex-col items-center gap-2 mb-5">
{ev.date&&ev.date[ln]&&<span className="bg-accent text-white px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide shadow-sm">{ev.date[ln]}</span>}
{ev.location&&ev.location[ln]&&<span className="bg-white/20 backdrop-blur-sm border border-white/30 text-white px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide text-center">{ev.location[ln]}</span>}</div>);}

function Sheet({onClose,children,label}){useEffect(()=>{const k=e=>{if(e.key==="Escape")onClose();};document.addEventListener("keydown",k);const o=document.body.style.overflow;document.body.style.overflow="hidden";return()=>{document.removeEventListener("keydown",k);document.body.style.overflow=o;};},[onClose]);
return(<div className="fixed inset-0 z-[60] bg-black/50 flex items-end sm:items-center justify-center" onClick={onClose} role="dialog" aria-modal="true" aria-label={label}>

// ---------- Installationsseite ----------
function InstallPage({data:d,ln,setLn,t,onContinue}){const ev=(d&&d.event)||{name:"EBS Law Congress"};const[pf,setPf]=useState(platform);const[canPrompt,setCanPrompt]=useState(!!window.__installPrompt);
useEffect(()=>{const on=()=>setCanPrompt(!!window.__installPrompt);window.addEventListener("installprompt-ready",on);window.addEventListener("app-installed",onContinue);return()=>{window.removeEventListener("installprompt-ready",on);window.removeEventListener("app-installed",onContinue);};},[onContinue]);
const install=async()=>{const p=window.__installPrompt;if(!p)return;p.prompt();try{const r=await p.userChoice;if(r&&r.outcome==="accepted")onContinue();}catch(e){}window.__installPrompt=null;setCanPrompt(false);};
const steps=pf==="ios"?t.inst.iosSteps:t.inst.andSteps;

<section className="relative overflow-hidden">

<div className="absolute inset-0 bg-black/60"/>

{ev.motto&&ev.motto[ln]&&<p className="font-serif text-lg leading-snug text-white/90 max-w-md mx-auto mb-4">„{ev.motto[ln]}“</p>}

</div></section>

<section className="px-4 py-12">

<div className="max-w-md mx-auto">
{canPrompt&&<button onClick={install} className="w-full bg-accent text-white px-6 py-3.5 rounded-sm font-medium flex items-center justify-center gap-2 shadow-sm mb-6"><I.Dl size={18}/>{t.inst.btn}</button>}
<div className="flex justify-center mb-6"><div className="inline-flex bg-white rounded-lg p-1 shadow-sm border border-ink3/20">
{[["ios",t.inst.ios],["android",t.inst.android]].map(([id,lb])=><button key={id} onClick={()=>setPf(id)} className={`px-4 py-2.5 rounded-md text-sm font-semibold transition-all ${pf===id?"bg-primary text-white shadow-md":"text-ink3"}`}>{lb}</button>)}</div></div>

{pf==="ios"&&<p className="text-xs text-ink3 mt-4 text-center">{t.inst.iosHint}</p>}
<div className="grid grid-cols-3 gap-3 mt-10">{t.inst.feat.map(([ic,lb])=>{const Ic=I[ic];return(<div key={lb} className="text-center"><div className="w-12 h-12 mx-auto rounded-full bg-white border border-ink3/10 shadow-sm flex items-center justify-center text-primary mb-2"><Ic size={20}/></div><p className="text-xs font-semibold text-ink2">{lb}</p></div>);})}</div>
<button onClick={onContinue} className="w-full mt-10 border border-primary text-primary px-6 py-3 rounded-sm font-medium flex items-center justify-center gap-2">{t.inst.cont}<I.Arrow size={16}/></button>

</div>);}

// ---------- Zeitplan ----------
function TypeBadge({type,t}){return <span className="inline-block text-xs text-ink3 font-medium bg-cream px-2 py-0.5 rounded">{t.types[type]||t.types.other}</span>;}
function SubEvents({items}){if(!items||!items.length)return null;return(<div className="mt-3 pl-3 border-l-2 border-accent/40 space-y-1">{items.map((s,i)=><p key={i} className="text-sm text-ink2"><span className="font-semibold text-primary mr-2">{s.time}</span>– {s.title}</p>)}</div>);}

function EventCard({e,saved,onToggle,onOpen,t}){return(
<div className="animate-fadeUp bg-white p-5 rounded-lg shadow-sm border border-ink3/10 cursor-pointer active:bg-cream/50" onClick={()=>onOpen(e)}>
<div className="flex items-start justify-between gap-3">
<div className="min-w-0 flex-1">
<p className="text-xl font-bold text-primary">{e.time}</p>
<div className="mt-1 mb-3"><TypeBadge type={e.type} t={t}/></div>

{e.speaker&&<p className="flex items-center text-ink2 text-sm mt-1.5"><I.Usr size={15} className="mr-2 flex-shrink-0 text-ink3"/>{e.speaker}</p>}
{e.location&&<p className="flex items-center text-ink3 text-sm mt-1.5"><I.Pin size={15} className="mr-2 flex-shrink-0 text-accent"/>{e.location}</p>}
<SubEvents items={e.subEvents}/></div>
<button onClick={ev=>{ev.stopPropagation();onToggle(e.id);}} aria-label={saved?t.schedule.saved:t.schedule.save} aria-pressed={saved} className={`flex-shrink-0 -mr-1 -mt-1 p-2 rounded-sm transition-colors ${saved?"text-accent":"text-ink3/40"}`}>{saved?<I.BmF size={22}/>:<I.Bm size={22}/>}</button>
</div></div>);}

function EventDetail({e,saved,onToggle,onClose,t,ln,speakers}){const ms=matchSpeakers(e,speakers);return(
<Sheet onClose={onClose} label={e.title}>
<div className="bg-primary text-white px-6 pt-5 pb-6 relative">
<button onClick={onClose} aria-label={t.gen.close} className="absolute right-3 top-3 p-2 text-white/70"><I.X size={20}/></button>
<p className="text-2xl font-bold">{e.time}</p>
<span className="inline-block text-xs font-medium bg-white/15 px-2 py-0.5 rounded mt-1">{t.types[e.type]||t.types.other}</span>
<h2 className="font-serif text-2xl font-bold leading-tight mt-3 pr-6">{e.title}</h2></div>
<div className="p-6">
{((e.speaker&&!ms.length)||e.location)&&<div className="space-y-2 mb-4">
{e.speaker&&!ms.length&&<p className="flex items-center text-ink2 text-sm"><I.Usr size={16} className="mr-2 text-ink3"/>{e.speaker}</p>}
{e.location&&<p className="flex items-center text-ink2 text-sm"><I.Pin size={16} className="mr-2 text-accent"/>{e.location}</p>}</div>}
<SubEvents items={e.subEvents}/>
{e.description&&<p className="text-[15px] text-ink2 leading-relaxed my-4">{e.description}</p>}
{ms.length>0&&<div className="space-y-2 my-5">{ms.map(p=><div key={p.id} className="flex items-center gap-3 bg-cream rounded-lg p-3">
<img src={p.img} alt={p.n} className="w-12 h-12 rounded-full object-cover object-[center_20%] flex-shrink-0" onError={ev=>{ev.target.style.visibility='hidden'}}/>
<div className="min-w-0"><p className="font-serif font-bold text-primary">{p.n}</p><p className="text-xs text-ink3">{ln==="de"?p.r:p.re}{(ln==="de"?p.c:p.ce)?` · ${ln==="de"?p.c:p.ce}`:""}</p></div></div>)}</div>}
<button onClick={()=>onToggle(e.id)} className={`w-full mt-2 px-6 py-3 rounded-sm font-medium flex items-center justify-center gap-2 transition-colors ${saved?"border border-accent text-accent bg-white":"bg-accent text-white"}`}>{saved?<><I.BmF size={18}/>{t.schedule.saved}</>:<><I.Bm size={18}/>{t.schedule.save}</>}</button>
</div></Sheet>);}

function Hero({d,ln,t,status,onProgram}){const ev=d.event;return(
<section className="relative overflow-hidden -mx-4 -mt-6 mb-0">
<img src={img(d,"hero")} alt="" className="absolute inset-0 w-full h-full object-cover"/>
<div className="absolute inset-0 bg-black/60"/>
<div className="relative z-10 text-center text-white px-5 pt-10 pb-10">
<Pills ev={ev} ln={ln}/>
{ev.motto&&ev.motto[ln]&&<h1 className="font-serif text-[26px] font-bold leading-tight mb-6 max-w-xl mx-auto">{ev.motto[ln]}</h1>}
<div className="flex flex-col gap-3 max-w-xs mx-auto">
<button onClick={onProgram} className="bg-accent text-white px-6 py-3 rounded-sm font-medium">{t.gen.program}</button>
{ev.ticketUrl&&<a href={ev.ticketUrl} target="_blank" rel="noopener noreferrer" className="border border-white text-white px-6 py-3 rounded-sm font-medium">{t.gen.tickets}</a>}</div>
<p className="text-[11px] text-white/60 mt-6">{status==="offline"?t.gen.offline:`${t.gen.updated}: ${fmtTs(d.updatedAt,ln)}`}</p>
</div></section>);}

function ScheduleView({d,ln,t,saved,onToggle,status}){const[ad,setAd]=useState(0);const[fi,setFi]=useState("all");const[sel,setSel]=useState(null);const days=d.schedule[ln]||d.schedule.de;const di=Math.min(ad,Math.max(days.length-1,0));
const list=useMemo(()=>{const ev=days[di]?.events||[];if(fi==="talks")return ev.filter(e=>isTalk(e.type));if(fi==="ws")return ev.filter(e=>e.type==="workshop"||e.type==="interview");return ev;},[days,di,fi]);
const toProgram=()=>{const el=document.getElementById("zeitplan");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});};
return(<div>
<Hero d={d} ln={ln} t={t} status={status} onProgram={toProgram}/>
<section id="zeitplan" className="pt-12 scroll-mt-20">
<SectionHead title={t.schedule.title}/>
<div className="flex justify-center mb-5"><div className="inline-flex bg-white rounded-lg p-1 shadow-sm border border-ink3/20">
{days.map((dy,i)=><button key={i} onClick={()=>setAd(i)} className={`px-6 py-2.5 rounded-md text-sm font-semibold transition-all ${di===i?"bg-primary text-white shadow-md":"text-ink3"}`}>{dy.day}</button>)}</div></div>
<div className="flex justify-center gap-2 mb-6">{[["all",t.schedule.all],["talks",t.schedule.talks],["ws",t.schedule.ws]].map(([id,lb])=><button key={id} onClick={()=>setFi(id)} className={`px-3 py-1.5 rounded-sm text-xs font-semibold border transition-colors ${fi===id?"bg-primary border-primary text-white":"bg-white border-ink3/20 text-ink3"}`}>{lb}</button>)}</div>
<div className="space-y-4">{list.length===0?<p className="text-center text-ink3 py-12 text-sm">{t.schedule.none}</p>:list.map(e=><EventCard key={e.id} e={e} saved={saved.has(e.id)} onToggle={onToggle} onOpen={setSel} t={t}/>)}</div>
</section>
{sel&&<EventDetail e={sel} saved={saved.has(sel.id)} onToggle={onToggle} onClose={()=>setSel(null)} t={t} ln={ln} speakers={d.speakers}/>}
</div>);}

function MyPlanView({d,ln,t,saved,onToggle}){const[sel,setSel]=useState(null);const days=d.schedule[ln]||d.schedule.de;
const groups=useMemo(()=>days.map(dy=>({day:dy.day,events:dy.events.filter(e=>saved.has(e.id))})).filter(g=>g.events.length),[days,saved]);
const n=groups.reduce((a,g)=>a+g.events.length,0);
return(<div className="pt-6">
<SectionHead label={t.my.label} title={t.my.title} desc={n?t.my.count(n):null}/>
{n===0?<div className="bg-white rounded-lg border border-ink3/10 shadow-sm text-center px-6 py-12"><I.Bm size={40} className="text-accent/40 mx-auto mb-4"/><p className="font-serif text-lg font-bold text-primary mb-2">{t.my.empty}</p><p className="text-ink3 text-sm">{t.my.hint}</p></div>
:groups.map(g=><div key={g.day} className="mb-8"><h3 className="font-serif text-xl font-bold text-primary mb-3 flex items-center gap-3"><span className="w-1 h-6 bg-accent inline-block"/>{g.day}</h3><div className="space-y-4">{g.events.map(e=><EventCard key={e.id} e={e} saved={true} onToggle={onToggle} onOpen={setSel} t={t}/>)}</div></div>)}
{sel&&<EventDetail e={sel} saved={saved.has(sel.id)} onToggle={onToggle} onClose={()=>setSel(null)} t={t} ln={ln} speakers={d.speakers}/>}
</div>);}

// ---------- Raumplan ----------
function RoomView({d,ln,t}){const rn=Object.assign({mainStage:"Main Stage",max:"Max",audi:"Audi",weinkeller:"Weinkeller",catering:"Catering"},(d.rooms&&d.rooms[ln])||{});const plan=img(d,"roomPlan");
const rooms=[["mainStage","bg-primary text-white"],["max","bg-accent text-white"],["audi","bg-accent text-white"],["weinkeller","bg-white text-primary border-2 border-primary"],["catering","bg-white text-ink border-2 border-accent"]];
return(<div className="pt-6">
<SectionHead label={t.room.label} title={t.room.title} desc={t.room.desc}/>
{plan&&<a href={plan} target="_blank" rel="noopener noreferrer" className="block bg-white rounded-lg shadow-md p-3 mb-2"><img src={plan} alt={t.room.title} className="w-full h-auto rounded"/></a>}
{plan&&<p className="text-center text-xs text-accent font-semibold mb-8"><a href={plan} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-1">{t.room.open}<I.EL size={12}/></a></p>}
<div className="space-y-3">{rooms.map(([id,cl])=><div key={id} className="bg-white rounded-lg border border-ink3/10 shadow-sm p-4 flex items-center gap-4">
<div className={`w-11 h-11 rounded-sm flex items-center justify-center flex-shrink-0 ${cl}`}><I.Pin size={18}/></div>
<div><h3 className="font-serif font-bold text-primary text-lg leading-tight">{rn[id]}</h3>{t.room.d[id]&&<p className="text-sm text-ink3 mt-0.5">{t.room.d[id]}</p>}</div></div>)}</div>
{d.event.location&&d.event.location[ln]&&<p className="flex items-start justify-center text-sm text-ink2 mt-8 text-center"><I.Pin size={16} className="mr-2 mt-0.5 text-accent flex-shrink-0"/>{d.event.location[ln]}</p>}
</div>);}

// ---------- Speaker ----------
function SpeakersView({d,ln,t}){const[sel,setSel]=useState(null);const org=s=>ln==="de"?s.c:s.ce;const role=s=>ln==="de"?s.r:s.re;
return(<div className="bg-primary -mx-4 -mt-6 px-4 pt-10 pb-10 min-h-[calc(100vh-8rem)]">
<SectionHead title={t.speakers.title} dark/>
<div className="grid grid-cols-2 gap-3">{d.speakers.map(s=><button key={s.id} onClick={()=>setSel(s)} className="relative overflow-hidden rounded-sm shadow-lg text-left animate-fadeUp">
<div className="relative pt-[133.33%] bg-white/5">
<img src={s.img} alt={s.n} loading="lazy" className="absolute inset-0 w-full h-full object-cover object-[center_20%]"/>
<div className="absolute inset-0 bg-gradient-to-t from-primary via-black/40 to-transparent opacity-90"/>
<div className="absolute bottom-0 left-0 w-full p-3 text-white">
<h3 className="font-serif text-[15px] font-bold leading-tight mb-1">{s.n}</h3>
<p className="text-sky-300 font-medium text-xs leading-snug">{role(s)}</p>
{org(s)&&<p className="text-gray-300 text-[11px] leading-snug mt-0.5">{org(s)}</p>}</div></div></button>)}</div>
{sel&&<Sheet onClose={()=>setSel(null)} label={sel.n}>
<div className="relative">
<div className="relative h-72 bg-primary"><img src={sel.img} alt={sel.n} className="absolute inset-0 w-full h-full object-cover object-[center_20%]"/><div className="absolute inset-0 bg-gradient-to-t from-primary via-black/30 to-transparent"/></div>
<button onClick={()=>setSel(null)} aria-label={t.gen.close} className="absolute right-3 top-3 p-2 rounded-full bg-black/30 text-white"><I.X size={20}/></button>
<div className="absolute bottom-0 left-0 right-0 p-6 text-white"><h2 className="font-serif text-2xl font-bold">{sel.n}</h2><p className="text-sky-300 font-medium text-sm mt-1">{role(sel)}</p>{org(sel)&&<p className="text-gray-300 text-xs mt-0.5">{org(sel)}</p>}</div></div>
<div className="p-6">
{(ln==="de"?sel.bio:sel.bioe)&&<p className="text-[15px] text-ink2 leading-relaxed">{ln==="de"?sel.bio:sel.bioe}</p>}
{sel.li&&<a href={sel.li} target="_blank" rel="noopener noreferrer" className="mt-6 w-full bg-primary text-white px-6 py-3 rounded-sm font-medium flex items-center justify-center gap-2"><LinkedIn size={16}/>LinkedIn</a>}
<button onClick={()=>setSel(null)} className="mt-3 w-full border border-ink3/30 text-ink2 px-6 py-3 rounded-sm font-medium">{t.gen.close}</button></div></Sheet>}
</div>);}

// ---------- Partner ----------
function PartnersView({d,ln,t}){return(<div className="bg-white -mx-4 -mt-6 px-4 pt-10 pb-10 min-h-[calc(100vh-8rem)]">
<SectionHead label={t.partners.label} title={t.partners.title}/>
<div className="grid grid-cols-2 gap-3">{d.sponsors.map((s,i)=><a key={i} href={s.u||undefined} target="_blank" rel="noopener noreferrer" className="flex flex-col items-center justify-center gap-3 border border-ink3/10 rounded-lg p-4 h-36 bg-white shadow-sm animate-fadeUp">
<div className="flex-1 flex items-center justify-center w-full"><img src={s.l} alt={s.n} loading="lazy" className="max-h-16 max-w-full object-contain"/></div>
<span className="text-[11px] font-semibold text-ink3 text-center leading-tight">{s.n}</span></a>)}</div>
<div className="text-center mt-10">
<a href={d.event.website||"https://www.ebs-lawcongress.com/"} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-primary text-white px-8 py-3 rounded-sm font-bold shadow-sm">{t.gen.website}<I.EL size={16}/></a></div>
</div>);}

// ---------- App ----------
function App(){
const[ln,setLnRaw]=useState(()=>store.get(LANG_KEY)||((navigator.language||"de").toLowerCase().startsWith("de")?"de":"en"));
const setLn=l=>{setLnRaw(l);store.set(LANG_KEY,l);document.documentElement.lang=l;};
const t=TT[ln];
const[showInstall,setShowInstall]=useState(()=>!isStandalone()&&!sessionStorage.getItem(SKIP_KEY));
const cont=useCallback(()=>{try{sessionStorage.setItem(SKIP_KEY,"1");}catch(e){}setShowInstall(false);window.scrollTo(0,0);},[]);
const[vw,setVw]=useState("schedule");
const[saved,setSaved]=useState(()=>{try{return new Set(JSON.parse(store.get(SAVED_KEY)||"[]"));}catch(e){return new Set();}});
const toggle=useCallback(id=>{setSaved(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);store.set(SAVED_KEY,JSON.stringify([...n]));return n;});},[]);
const{data:d,status,sync}=useCongressData();
useEffect(()=>{const b=document.getElementById("boot");if(b)b.remove();document.documentElement.lang=ln;},[]);
const savedCount=useMemo(()=>d?d.schedule.de.reduce((n,dy)=>n+dy.events.filter(e=>saved.has(e.id)).length,0):0,[d,saved]);
const go=v=>{setVw(v);window.scrollTo(0,0);};

if(showInstall)return <InstallPage data={d} ln={ln} setLn={setLn} t={t} onContinue={cont}/>;

const nav=[["schedule",t.nav.schedule,I.Cal],["my",t.nav.my,I.Bm],["room",t.nav.room,I.Map],["speakers",t.nav.speakers,I.Users],["partners",t.nav.partners,I.Award]];
return(<div className="min-h-screen bg-cream">
<header className="sticky top-0 z-50 bg-primary text-white shadow-lg pt-safe">
<div className="flex justify-between items-center h-16 px-4">
<button onClick={()=>go("schedule")} className="flex items-center gap-3 min-w-0"><img src={img(d,"logo")} alt="" className="h-10 object-contain flex-shrink-0"/><span className="font-serif text-[17px] leading-tight font-bold text-cream truncate">{(d&&d.event.name)||"EBS Law Congress"}</span></button>
<div className="flex items-center gap-3 flex-shrink-0">
{savedCount>0&&vw!=="my"&&<button onClick={()=>go("my")} aria-label={t.nav.my} className="relative text-xs font-bold bg-accent px-3 py-1 rounded-sm flex items-center gap-1"><I.BmF size={12}/>{savedCount}</button>}
<button onClick={()=>setLn(ln==="de"?"en":"de")} className="text-xs font-bold border border-white px-3 py-1 rounded-sm">{ln==="de"?"EN":"DE"}</button></div></div></header>

<main className="px-4 pt-6 pb-28 max-w-2xl mx-auto">
{!d?<div className="text-center py-24">{status==="loading"?<p className="text-ink3 text-sm">{t.gen.loading}</p>:<><p className="text-ink2 text-sm mb-5">{t.gen.loadErr}</p><button onClick={sync} className="bg-accent text-white px-6 py-3 rounded-sm font-medium">{t.gen.retry}</button></>}</div>:<>
{vw==="schedule"&&<ScheduleView d={d} ln={ln} t={t} saved={saved} onToggle={toggle} status={status}/>}
{vw==="my"&&<MyPlanView d={d} ln={ln} t={t} saved={saved} onToggle={toggle}/>}
{vw==="room"&&<RoomView d={d} ln={ln} t={t}/>}
{vw==="speakers"&&<SpeakersView d={d} ln={ln} t={t}/>}
{vw==="partners"&&<PartnersView d={d} ln={ln} t={t}/>}</>}
</main>

<nav className="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-ink3/15 pb-safe">
<div className="flex max-w-2xl mx-auto">{nav.map(([id,lb,Ic])=>{const a=vw===id;return(<button key={id} onClick={()=>go(id)} aria-current={a?"page":undefined} className={`relative flex-1 flex flex-col items-center pt-2.5 pb-2 transition-colors ${a?"text-primary":"text-ink3/60"}`}>
{a&&<span className="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-[3px] bg-accent"/>}
<Ic size={21} strokeWidth={a?2.4:1.8}/><span className={`text-[10px] mt-1 ${a?"font-bold":"font-medium"}`}>{lb}</span></button>);})}</div></nav>
</div>);}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
