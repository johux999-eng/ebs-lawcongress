name: Website-Daten synchronisieren

on:
  schedule:
    # stündlich (Minute 17, um die Lastspitze zur vollen Stunde zu meiden)
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync-data.mjs
      - .github/workflows/sync-data.yml

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Daten von ebs-lawcongress.com abrufen
        run: node scripts/sync-data.mjs

      - name: Änderungen committen
        run: |
          if git diff --quiet -- data.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Daten von ebs-lawcongress.com synchronisiert"
          git push
